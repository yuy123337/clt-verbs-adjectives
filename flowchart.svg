<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 0 672 1112" width="672" height="1112" role="img" aria-labelledby="fc-title fc-desc">
  <title id="fc-title">Counting verbs and adjectives: the flow</title>
  <desc id="fc-desc">8,800 Michelin Guide introductions are tagged with spaCy, verbs and adjectives are counted, and the counts are combined into a score. The score has to pass three checks: a sane spread, extremes that read right, and a 0 that means one thing. Failing a check sends me back to rewrite the formula, from v1 to v2 to v3, and v3 is kept. Groups are then compared with two more checks: whether tagging could explain a gap, which is still open for Japan, and whether each group is big enough. Last, Japanese restaurants are compared across 7 countries.</desc>
  <!--
    HOW TO EDIT THIS FLOWCHART
    - To relabel a step, change the words inside its <text> element.
    - Colors and fonts are in the <style> block right below.
  -->
  <style>
    text{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Liberation Serif",serif; fill:#2b2420}
    .fc-bg{fill:#ffffff}
    .fc-node{fill:#ffffff; stroke:#2b2420; stroke-width:1.2}
    .fc-dia{fill:#f4ead8; stroke:#2b2420; stroke-width:1.2}
    .fc-open{fill:#ffffff; stroke:#6c6155; stroke-width:1.2; stroke-dasharray:5 4}
    .fc-line{fill:none; stroke:#2b2420; stroke-width:1.4}
    .fc-dash{fill:none; stroke:#6c6155; stroke-width:1.4; stroke-dasharray:5 4}
    .fc-loop{fill:none; stroke:#8c2f2a; stroke-width:1.6}
    .fc-dot{fill:#8c2f2a}
    .fc-bracket{stroke:#e5d9c6; stroke-width:1.5}
    .fc-circ{fill:none; stroke:#2b2420; stroke-width:1.1}
    .fc-ah{fill:#2b2420} .fc-ah-red{fill:#8c2f2a} .fc-ah-muted{fill:#6c6155}
    .fc-t{font-size:14.5px; font-weight:600}
    .fc-s{font-size:12px; fill:#6c6155}
    .fc-m{font-family:"IBM Plex Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size:11.5px; fill:#6c6155}
    .fc-e{font-size:12px; font-style:italic; fill:#6c6155}
    .fc-r{font-size:12px; fill:#8c2f2a}
    .fc-q{font-size:13.5px}
    .fc-num{font-size:12px; font-weight:700}
    .fc-ph{font-size:22px; font-weight:600; font-variant-numeric:lining-nums}
    .fc-pw{font-size:10.5px; font-weight:600; letter-spacing:.14em; fill:#6c6155}
    .fc-cap{font-size:10px; font-weight:600; letter-spacing:.12em; fill:#6c6155}
    .fc-ink{font-size:12.5px; fill:#2b2420}
    .fc-mono{font-family:"IBM Plex Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size:11.5px}
  </style>
  <defs>
    <marker id="fc-a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fc-ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="fc-a-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="fc-ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="fc-a-muted" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fc-ah-muted" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- white background -->
  <rect class="fc-bg" x="-16" y="0" width="672" height="1112"/>

  <!-- phase labels (left gutter) -->
  <g>
    <text class="fc-ph" x="36" y="44" text-anchor="middle">1</text>
    <text class="fc-pw" x="36" y="62" text-anchor="middle">COUNT</text>
    <line class="fc-bracket" x1="36" y1="72" x2="36" y2="256"/>
    <text class="fc-ph" x="36" y="330" text-anchor="middle">2</text>
    <text class="fc-pw" x="36" y="348" text-anchor="middle">SCORE</text>
    <line class="fc-bracket" x1="36" y1="358" x2="36" y2="682"/>
    <text class="fc-ph" x="36" y="756" text-anchor="middle">3</text>
    <text class="fc-pw" x="36" y="774" text-anchor="middle">COMPARE</text>
    <line class="fc-bracket" x1="36" y1="784" x2="36" y2="1092"/>
  </g>

  <!-- input -->
  <g>
    <rect class="fc-node" x="80" y="20" width="320" height="52" rx="26"/>
    <text class="fc-t" x="240" y="42" text-anchor="middle">8,800 restaurant introductions</text>
    <text class="fc-s" x="240" y="60" text-anchor="middle">English-language Michelin Guide</text>
  </g>
  <line class="fc-line" x1="240" y1="72" x2="240" y2="112" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="250" y="96">raw text</text>

  <!-- 1 tag -->
  <g>
    <rect class="fc-node" x="80" y="112" width="320" height="52" rx="4"/>
    <circle class="fc-circ" cx="104" cy="138" r="11"/>
    <text class="fc-num" x="104" y="142.2" text-anchor="middle">1</text>
    <text class="fc-t" x="252" y="134" text-anchor="middle">Tag each word's part of speech</text>
    <text class="fc-m" x="252" y="152" text-anchor="middle">spaCy en_core_web_sm</text>
  </g>
  <line class="fc-line" x1="240" y1="164" x2="240" y2="204" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="250" y="188">a tag on every word</text>

  <!-- 2 count -->
  <g>
    <rect class="fc-node" x="80" y="204" width="320" height="52" rx="4"/>
    <circle class="fc-circ" cx="104" cy="230" r="11"/>
    <text class="fc-num" x="104" y="234.2" text-anchor="middle">2</text>
    <text class="fc-t" x="252" y="226" text-anchor="middle">Count verbs (V) and adjectives (A)</text>
    <text class="fc-s" x="252" y="244" text-anchor="middle">per introduction · AUX (is, has) not counted</text>
  </g>
  <line class="fc-line" x1="240" y1="256" x2="240" y2="306" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="250" y="286">V and A for each one</text>

  <!-- 3 combine -->
  <g>
    <rect class="fc-node" x="80" y="306" width="320" height="52" rx="4"/>
    <circle class="fc-circ" cx="104" cy="332" r="11"/>
    <text class="fc-num" x="104" y="336.2" text-anchor="middle">3</text>
    <text class="fc-t" x="252" y="328" text-anchor="middle">Combine V and A into a score</text>
    <text class="fc-s" x="252" y="346" text-anchor="middle">one number per introduction</text>
  </g>
  <line class="fc-line" x1="240" y1="358" x2="240" y2="398" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="250" y="382">each version</text>

  <!-- check A -->
  <polygon class="fc-dia" points="80,432 240,398 400,432 240,466"/>
  <text class="fc-q" x="240" y="436.5" text-anchor="middle"><tspan font-weight="700">A</tspan> · Is the spread sane?</text>
  <line class="fc-loop" x1="400" y1="432" x2="624" y2="432"/>
  <text class="fc-r" x="410" y="425"><tspan font-weight="700">no</tspan><tspan dx="7">v1: max 5,000</tspan></text>
  <line class="fc-line" x1="240" y1="466" x2="240" y2="506" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="250" y="490">yes</text>

  <!-- check B -->
  <polygon class="fc-dia" points="80,540 240,506 400,540 240,574"/>
  <text class="fc-q" x="240" y="544.5" text-anchor="middle"><tspan font-weight="700">B</tspan> · Do the extremes read right?</text>
  <line class="fc-loop" x1="400" y1="540" x2="624" y2="540"/>
  <text class="fc-r" x="410" y="533"><tspan font-weight="700">no</tspan></text>
  <line class="fc-line" x1="240" y1="574" x2="240" y2="614" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="250" y="598">yes</text>

  <!-- check C -->
  <polygon class="fc-dia" points="80,648 240,614 400,648 240,682"/>
  <text class="fc-q" x="240" y="652.5" text-anchor="middle"><tspan font-weight="700">C</tspan> · Does 0 mean one thing?</text>
  <text class="fc-r" x="410" y="641"><tspan font-weight="700">no</tspan><tspan dx="7">v2: 0 meant two things</tspan></text>

  <!-- the revise loop: C -> rail -> back into step 3 -->
  <path class="fc-loop" d="M400,648 H624 V332 H401" marker-end="url(#fc-a-red)"/>
  <circle class="fc-dot" cx="624" cy="432" r="3"/>
  <circle class="fc-dot" cx="624" cy="540" r="3"/>
  <text class="fc-r" x="512" y="322" text-anchor="middle" font-style="italic">rewrite the formula</text>
  <text class="fc-r fc-mono" x="512" y="350" text-anchor="middle">v1 → v2 → v3</text>

  <line class="fc-line" x1="240" y1="682" x2="240" y2="732" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="250" y="712">yes · keep v3</text>

  <!-- 4 compare -->
  <g>
    <rect class="fc-node" x="80" y="732" width="320" height="52" rx="4"/>
    <circle class="fc-circ" cx="104" cy="758" r="11"/>
    <text class="fc-num" x="104" y="762.2" text-anchor="middle">4</text>
    <text class="fc-t" x="252" y="754" text-anchor="middle">Compare groups</text>
    <text class="fc-s" x="252" y="772" text-anchor="middle">price · country · cuisine · distinction</text>
  </g>
  <line class="fc-line" x1="240" y1="784" x2="240" y2="824" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="250" y="808">group averages</text>

  <!-- check D -->
  <polygon class="fc-dia" points="80,858 240,824 400,858 240,892"/>
  <text class="fc-q" x="240" y="862.5" text-anchor="middle"><tspan font-weight="700">D</tspan> · Could tagging explain a gap?</text>
  <line class="fc-dash" x1="400" y1="858" x2="479" y2="858" marker-end="url(#fc-a-muted)"/>
  <text class="fc-e" x="410" y="851">maybe</text>
  <rect class="fc-open" x="480" y="826" width="156" height="64" rx="4"/>
  <text class="fc-cap" x="558" y="846" text-anchor="middle">OPEN CHECK</text>
  <text class="fc-s fc-ink" x="558" y="864" text-anchor="middle">How are loanwords</text>
  <text class="fc-s fc-ink" x="558" y="880" text-anchor="middle">tagged? (Japan)</text>
  <line class="fc-line" x1="240" y1="892" x2="240" y2="932" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="250" y="916">go on, flagged</text>

  <!-- check E -->
  <polygon class="fc-dia" points="80,966 240,932 400,966 240,1000"/>
  <text class="fc-q" x="240" y="970.5" text-anchor="middle"><tspan font-weight="700">E</tspan> · Enough restaurants per group?</text>
  <line class="fc-line" x1="400" y1="966" x2="479" y2="966" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="410" y="959">no</text>
  <rect class="fc-node" x="480" y="944" width="156" height="44" rx="22"/>
  <text class="fc-s fc-ink" x="558" y="970.5" text-anchor="middle">Leave the group out</text>
  <line class="fc-line" x1="240" y1="1000" x2="240" y2="1040" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="250" y="1024">yes · at least 26 each</text>

  <!-- 5 one cuisine -->
  <g>
    <rect class="fc-node" x="80" y="1040" width="320" height="52" rx="4"/>
    <circle class="fc-circ" cx="104" cy="1066" r="11"/>
    <text class="fc-num" x="104" y="1070.2" text-anchor="middle">5</text>
    <text class="fc-t" x="252" y="1062" text-anchor="middle">One cuisine across countries</text>
    <text class="fc-s" x="252" y="1080" text-anchor="middle">Japanese restaurants in 7 countries</text>
  </g>
</svg>
