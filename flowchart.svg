<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 696" width="680" height="696" role="img" aria-labelledby="fc-title fc-desc">
  <title id="fc-title">The flow</title>
  <desc id="fc-desc">8,800 English-language Michelin Guide restaurant introductions. Tag every word with spaCy (verb, adjective, noun and so on). Count verbs (V) and adjectives (A); each word counts once and helping verbs like is are not counted. Score each introduction as (A − V) ÷ (A + V + 0.001): −1 means only verbs (concrete), +1 only adjectives (abstract), 0 balanced or nothing to count. Check the scores: bell-shaped, centered a little above 0; the most concrete has 5 verbs and 0 adjectives, the most abstract 7 adjectives and 0 verbs. Compare groups by price, country, cuisine and distinction, with at least 26 restaurants per group from a power analysis. An open check asks whether loanwords are tagged right, for Japan. Last, compare Japanese restaurants across 7 countries.</desc>
  <!--
    HOW TO EDIT THIS FLOWCHART
    - Each box is a <rect> followed by its <text> lines. Change the words to relabel.
    - Font (Arial) and colors are in the <style> block below.
  -->
  <style>
    text{font-family:Arial,"Liberation Sans",Helvetica,sans-serif; fill:#222222}
    .box{fill:#ffffff; stroke:#333333; stroke-width:1.2}
    .note{fill:#ffffff; stroke:#777777; stroke-width:1.2; stroke-dasharray:5 4}
    .arrow{fill:none; stroke:#333333; stroke-width:1.4}
    .link{fill:none; stroke:#777777; stroke-width:1.2; stroke-dasharray:5 4}
    .t{font-size:14px; font-weight:700}
    .s{font-size:12.5px; fill:#555555}
    .f{font-size:13px}
    .n{font-size:12px; fill:#555555}
    .nb{font-size:12px; font-weight:700; fill:#555555}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
  </defs>

  <rect x="0" y="0" width="680" height="696" fill="#ffffff"/>

  <!-- 1. the texts -->
  <rect class="box" x="40" y="20" width="420" height="56" rx="6"/>
  <text class="t" x="250" y="43" text-anchor="middle">8,800 restaurant introductions</text>
  <text class="s" x="250" y="63" text-anchor="middle">from the English-language Michelin Guide</text>
  <line class="arrow" x1="250" y1="76" x2="250" y2="104" marker-end="url(#ah)"/>

  <!-- 2. tag -->
  <rect class="box" x="40" y="104" width="420" height="56" rx="6"/>
  <text class="t" x="250" y="127" text-anchor="middle">Tag every word</text>
  <text class="s" x="250" y="147" text-anchor="middle">spaCy labels each word: verb, adjective, noun, …</text>
  <line class="arrow" x1="250" y1="160" x2="250" y2="188" marker-end="url(#ah)"/>

  <!-- 3. count -->
  <rect class="box" x="40" y="188" width="420" height="72" rx="6"/>
  <text class="t" x="250" y="211" text-anchor="middle">Count</text>
  <text class="s" x="250" y="231" text-anchor="middle">V = number of verbs, A = number of adjectives</text>
  <text class="s" x="250" y="249" text-anchor="middle">each word counts once; helping verbs like "is" are not counted</text>
  <line class="arrow" x1="250" y1="260" x2="250" y2="288" marker-end="url(#ah)"/>

  <!-- 4. score -->
  <rect class="box" x="40" y="288" width="420" height="88" rx="6"/>
  <text class="t" x="250" y="311" text-anchor="middle">Score</text>
  <text class="f" x="250" y="331" text-anchor="middle">(A − V) ÷ (A + V + 0.001)</text>
  <text class="s" x="250" y="349" text-anchor="middle">−1 = only verbs (concrete), +1 = only adjectives (abstract)</text>
  <text class="s" x="250" y="367" text-anchor="middle">0 = balanced, or nothing to count</text>
  <line class="arrow" x1="250" y1="376" x2="250" y2="404" marker-end="url(#ah)"/>

  <!-- 5. check -->
  <rect class="box" x="40" y="404" width="420" height="88" rx="6"/>
  <text class="t" x="250" y="427" text-anchor="middle">Check the scores</text>
  <text class="s" x="250" y="447" text-anchor="middle">bell-shaped, centered a little above 0</text>
  <text class="s" x="250" y="465" text-anchor="middle">most concrete: 5 verbs, 0 adjectives</text>
  <text class="s" x="250" y="483" text-anchor="middle">most abstract: 7 adjectives, 0 verbs</text>
  <line class="arrow" x1="250" y1="492" x2="250" y2="520" marker-end="url(#ah)"/>

  <!-- 6. compare, with the open check -->
  <rect class="box" x="40" y="520" width="420" height="72" rx="6"/>
  <text class="t" x="250" y="543" text-anchor="middle">Compare groups</text>
  <text class="s" x="250" y="563" text-anchor="middle">price, country, cuisine, distinction</text>
  <text class="s" x="250" y="581" text-anchor="middle">at least 26 restaurants per group (power analysis)</text>
  <line class="link" x1="460" y1="556" x2="490" y2="556"/>
  <rect class="note" x="490" y="524" width="170" height="64" rx="6"/>
  <text class="nb" x="575" y="546" text-anchor="middle">Open check</text>
  <text class="n" x="575" y="563" text-anchor="middle">Are loanwords tagged</text>
  <text class="n" x="575" y="579" text-anchor="middle">right? (Japan)</text>
  <line class="arrow" x1="250" y1="592" x2="250" y2="620" marker-end="url(#ah)"/>

  <!-- 7. one cuisine -->
  <rect class="box" x="40" y="620" width="420" height="56" rx="6"/>
  <text class="t" x="250" y="643" text-anchor="middle">One cuisine across countries</text>
  <text class="s" x="250" y="663" text-anchor="middle">Japanese restaurants in 7 countries</text>
</svg>
