<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1116" width="800" height="1116" role="img" aria-labelledby="fc-title fc-desc">
  <title id="fc-title">Counting verbs and adjectives: the flow</title>
  <desc id="fc-desc">8,800 Michelin Guide introductions are tagged with spaCy, and verbs and adjectives are counted. Each introduction gets the score (A − V) ÷ (A + V + 0.001), from −1 (only verbs, concrete; the most concrete introduction has 5 verbs and 0 adjectives) through 0 (balanced, or nothing to count) to +1 (only adjectives, abstract; the most abstract has 7 adjectives and 0 verbs). The scores are checked: bell-shaped and centered a little above 0, the most concrete and most abstract at −1 and +1, and 0 only for balanced or nothing to count. Groups are then compared with two checks: could the tagger explain a gap, since foreign words may be tagged as nouns or verbs (an open check for Japan), and are there enough restaurants per group (power analysis, at least 26 each). Last, Japanese restaurants are compared across 7 countries.</desc>
  <!--
    HOW TO EDIT THIS FLOWCHART
    - To relabel a step or a check, change the words inside its <text> element.
    - Steps are white boxes; checks are tinted (the score checks box and the two diamonds).
    - Colors and the font (Arial) are in the <style> block right below.
  -->
  <style>
    text{font-family:Arial,"Liberation Sans","Helvetica Neue",Helvetica,sans-serif; fill:#2b2420}
    .fc-bg{fill:#ffffff}
    .fc-node{fill:#ffffff; stroke:#2b2420; stroke-width:1.2}
    .fc-check{fill:#f4ead8; stroke:#2b2420; stroke-width:1.2}
    .fc-open{fill:#ffffff; stroke:#6c6155; stroke-width:1.2; stroke-dasharray:5 4}
    .fc-line{fill:none; stroke:#2b2420; stroke-width:1.4}
    .fc-dash{fill:none; stroke:#6c6155; stroke-width:1.4; stroke-dasharray:5 4}
    .fc-bracket{stroke:#e5d9c6; stroke-width:1.5}
    .fc-tick{stroke:#6c6155; stroke-width:1.2}
    .fc-circ{fill:none; stroke:#2b2420; stroke-width:1.1}
    .fc-ah{fill:#2b2420} .fc-ah-muted{fill:#6c6155}
    .fc-t{font-size:14.5px; font-weight:700}
    .fc-s{font-size:12px; fill:#6c6155}
    .fc-f{font-size:13px}
    .fc-e{font-size:12px; font-style:italic; fill:#6c6155}
    .fc-q{font-size:13.5px}
    .fc-h{font-size:11.5px; font-style:italic; fill:#6c6155}
    .fc-c{font-size:12px}
    .fc-ok{fill:#3d6b3c; font-weight:700}
    .fc-k{font-size:12px; font-weight:700}
    .fc-verb{font-size:12px; font-weight:700; fill:#8a4a0c}
    .fc-adj{font-size:12px; font-weight:700; fill:#2b5786}
    .fc-num{font-size:12px; font-weight:700}
    .fc-ph{font-size:22px; font-weight:700}
    .fc-pw{font-size:10.5px; font-weight:700; letter-spacing:.14em; fill:#6c6155}
    .fc-cap{font-size:10px; font-weight:700; letter-spacing:.12em; fill:#6c6155}
    .fc-ink{font-size:12.5px; fill:#2b2420}
  </style>
  <defs>
    <marker id="fc-a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fc-ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="fc-a-muted" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fc-ah-muted" d="M0,0 L10,5 L0,10 z"/></marker>
    <linearGradient id="fc-scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a4a0c"/>
      <stop offset="0.5" stop-color="#e5d9c6"/>
      <stop offset="1" stop-color="#2b5786"/>
    </linearGradient>
  </defs>

  <!-- white background -->
  <rect class="fc-bg" x="0" y="0" width="800" height="1116"/>

  <!-- phase labels (left gutter) -->
  <g>
    <text class="fc-ph" x="44" y="44" text-anchor="middle">1</text>
    <text class="fc-pw" x="44" y="62" text-anchor="middle">COUNT</text>
    <line class="fc-bracket" x1="44" y1="72" x2="44" y2="256"/>
    <text class="fc-ph" x="44" y="330" text-anchor="middle">2</text>
    <text class="fc-pw" x="44" y="348" text-anchor="middle">SCORE</text>
    <line class="fc-bracket" x1="44" y1="358" x2="44" y2="622"/>
    <text class="fc-ph" x="44" y="696" text-anchor="middle">3</text>
    <text class="fc-pw" x="44" y="714" text-anchor="middle">COMPARE</text>
    <line class="fc-bracket" x1="44" y1="724" x2="44" y2="1096"/>
  </g>

  <!-- input -->
  <rect class="fc-node" x="90" y="20" width="460" height="52" rx="26"/>
  <text class="fc-t" x="320" y="42" text-anchor="middle">8,800 restaurant introductions</text>
  <text class="fc-s" x="320" y="60" text-anchor="middle">English-language Michelin Guide</text>
  <line class="fc-line" x1="320" y1="72" x2="320" y2="112" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="330" y="96">raw text</text>

  <!-- step 1: tag -->
  <rect class="fc-node" x="90" y="112" width="460" height="52" rx="4"/>
  <circle class="fc-circ" cx="114" cy="138" r="11"/>
  <text class="fc-num" x="114" y="142.2" text-anchor="middle">1</text>
  <text class="fc-t" x="332" y="134" text-anchor="middle">Tag each word's part of speech</text>
  <text class="fc-s" x="332" y="152" text-anchor="middle">spaCy en_core_web_sm</text>
  <line class="fc-line" x1="320" y1="164" x2="320" y2="204" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="330" y="188">a tag on every word</text>

  <!-- step 2: count -->
  <rect class="fc-node" x="90" y="204" width="460" height="52" rx="4"/>
  <circle class="fc-circ" cx="114" cy="230" r="11"/>
  <text class="fc-num" x="114" y="234.2" text-anchor="middle">2</text>
  <text class="fc-t" x="332" y="226" text-anchor="middle">Count verbs (V) and adjectives (A)</text>
  <text class="fc-s" x="332" y="244" text-anchor="middle">per introduction · AUX (is, has) not counted</text>
  <line class="fc-line" x1="320" y1="256" x2="320" y2="306" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="330" y="286">V and A for each introduction</text>

  <!-- step 3: score, with the scale and the examples from my notebook -->
  <rect class="fc-node" x="90" y="306" width="460" height="180" rx="4"/>
  <circle class="fc-circ" cx="114" cy="332" r="11"/>
  <text class="fc-num" x="114" y="336.2" text-anchor="middle">3</text>
  <text class="fc-t" x="332" y="330" text-anchor="middle">Score each introduction</text>
  <text class="fc-f" x="332" y="350" text-anchor="middle">(A − V) ÷ (A + V + 0.001)</text>
  <text class="fc-k" x="130" y="382" text-anchor="middle">−1</text>
  <text class="fc-k" x="320" y="382" text-anchor="middle">0</text>
  <text class="fc-k" x="510" y="382" text-anchor="middle">+1</text>
  <rect x="130" y="389" width="380" height="6" rx="3" fill="url(#fc-scale)"/>
  <line class="fc-tick" x1="130" y1="397" x2="130" y2="402"/>
  <line class="fc-tick" x1="320" y1="397" x2="320" y2="402"/>
  <line class="fc-tick" x1="510" y1="397" x2="510" y2="402"/>
  <text class="fc-verb" x="112" y="420">only verbs</text>
  <text class="fc-s" x="112" y="435">concrete</text>
  <text class="fc-h" x="112" y="456">most concrete:</text>
  <text class="fc-c" x="112" y="471">5 verbs, 0 adjectives</text>
  <text class="fc-c" x="320" y="420" text-anchor="middle">balanced,</text>
  <text class="fc-s" x="320" y="435" text-anchor="middle">or nothing to count</text>
  <text class="fc-adj" x="528" y="420" text-anchor="end">only adjectives</text>
  <text class="fc-s" x="528" y="435" text-anchor="end">abstract</text>
  <text class="fc-h" x="528" y="456" text-anchor="end">most abstract:</text>
  <text class="fc-c" x="528" y="471" text-anchor="end">7 adjectives, 0 verbs</text>
  <line class="fc-line" x1="320" y1="486" x2="320" y2="526" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="330" y="510">a score for every introduction</text>

  <!-- step 4: check the scores -->
  <rect class="fc-check" x="90" y="526" width="460" height="96" rx="4"/>
  <circle class="fc-circ" cx="114" cy="552" r="11"/>
  <text class="fc-num" x="114" y="556.2" text-anchor="middle">4</text>
  <text class="fc-t" x="332" y="550" text-anchor="middle">Check the scores</text>
  <text class="fc-c" x="150" y="574"><tspan class="fc-ok">✓</tspan> Spread: bell-shaped, centered a little above 0</text>
  <text class="fc-c" x="150" y="593"><tspan class="fc-ok">✓</tspan> Ends: the most concrete and most abstract sit at −1 and +1</text>
  <text class="fc-c" x="150" y="612"><tspan class="fc-ok">✓</tspan> Zero: only for balanced, or nothing to count</text>
  <line class="fc-line" x1="320" y1="622" x2="320" y2="672" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="330" y="652">all three pass</text>

  <!-- step 5: compare -->
  <rect class="fc-node" x="90" y="672" width="460" height="52" rx="4"/>
  <circle class="fc-circ" cx="114" cy="698" r="11"/>
  <text class="fc-num" x="114" y="702.2" text-anchor="middle">5</text>
  <text class="fc-t" x="332" y="694" text-anchor="middle">Compare groups</text>
  <text class="fc-s" x="332" y="712" text-anchor="middle">price · country · cuisine · distinction</text>
  <line class="fc-line" x1="320" y1="724" x2="320" y2="764" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="330" y="748">group averages</text>

  <!-- check: tagging -->
  <polygon class="fc-check" points="90,814 320,764 550,814 320,864"/>
  <text class="fc-q" x="320" y="811" text-anchor="middle">Could the tagger explain a gap?</text>
  <text class="fc-h" x="320" y="830" text-anchor="middle">foreign words may be tagged as nouns or verbs</text>
  <line class="fc-dash" x1="550" y1="814" x2="609" y2="814" marker-end="url(#fc-a-muted)"/>
  <text class="fc-e" x="558" y="807">maybe</text>
  <rect class="fc-open" x="610" y="782" width="180" height="64" rx="4"/>
  <text class="fc-cap" x="700" y="802" text-anchor="middle">OPEN CHECK</text>
  <text class="fc-ink" x="700" y="820" text-anchor="middle">How are loanwords</text>
  <text class="fc-ink" x="700" y="836" text-anchor="middle">tagged? (Japan)</text>
  <line class="fc-line" x1="320" y1="864" x2="320" y2="904" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="330" y="888">go on, flagged</text>

  <!-- check: group size -->
  <polygon class="fc-check" points="90,954 320,904 550,954 320,1004"/>
  <text class="fc-q" x="320" y="951" text-anchor="middle">Are there enough restaurants per group?</text>
  <text class="fc-h" x="320" y="970" text-anchor="middle">power analysis: medium effect, power .80</text>
  <line class="fc-line" x1="550" y1="954" x2="609" y2="954" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="558" y="947">no</text>
  <rect class="fc-node" x="610" y="932" width="180" height="44" rx="22"/>
  <text class="fc-ink" x="700" y="958.5" text-anchor="middle">Leave the group out</text>
  <line class="fc-line" x1="320" y1="1004" x2="320" y2="1044" marker-end="url(#fc-a)"/>
  <text class="fc-e" x="330" y="1028">yes · at least 26 each</text>

  <!-- step 6: one cuisine -->
  <rect class="fc-node" x="90" y="1044" width="460" height="52" rx="4"/>
  <circle class="fc-circ" cx="114" cy="1070" r="11"/>
  <text class="fc-num" x="114" y="1074.2" text-anchor="middle">6</text>
  <text class="fc-t" x="332" y="1066" text-anchor="middle">One cuisine across countries</text>
  <text class="fc-s" x="332" y="1084" text-anchor="middle">Japanese restaurants in 7 countries</text>
</svg>
